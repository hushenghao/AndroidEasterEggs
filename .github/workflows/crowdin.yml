name: Crowdin Synchronize

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  push:
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - 'app/src/main/res/values*/languages.xml'
      - 'core/resources/src/main/res/values*/strings*.xml'
      - 'eggs/AndroidNext/src/main/res/values*/strings*.xml'
      - 'eggs/RocketLauncher/src/main/res/values*/strings*.xml'
      - 'crowdin.yml'
    branches: [ main ]
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      upload_only:
        description: 'Only upload sources and translations (skip download and PR creation)'
        type: boolean
        default: false
        required: false

jobs:
  crowdin:
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        if: ${{ env.CROWDIN_PROJECT_ID == '' || env.CROWDIN_PERSONAL_TOKEN == '' }}
        run: exit 0

      - name: Checkout
        uses: actions/checkout@v7

      - name: Crowdin synchronize
        uses: crowdin/github-action@v3 # https://github.com/marketplace/actions/crowdin-action
        with:
          upload_sources: true
          upload_translations: true
          auto_approve_imported: true
          import_eq_suggestions: true
          download_translations: ${{ !inputs.upload_only }}

          create_pull_request: ${{ !inputs.upload_only }}
          localization_branch_name: l10n_crowdin_translations
          pull_request_title: 'feat: New Crowdin translations'
          pull_request_body: 'New Crowdin pull request with translations 🚀'
          commit_message: "feat: New translations from Crowdin"
          pull_request_base_branch_name: 'main'
          pull_request_labels: 'translations, enhancement'
          pull_request_assignees: 'crowdin-bot'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  progress:
    needs: crowdin
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        if: ${{ env.CROWDIN_PROJECT_ID == '' || env.CROWDIN_PERSONAL_TOKEN == '' }}
        run: exit 0

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip' # caching pip dependencies

      - name: Update Crowdin progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd script/crowdin
          pip install -r requirements.txt
          python start.py ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          cd "$GITHUB_WORKSPACE" # start.py writes the SVG relative to its cwd, but the git commands below need repo-root-relative paths
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet script/crowdin/crowdin_project_progress.svg; then
            echo "No changes to progress SVG"
            exit 0
          fi
          git add script/crowdin/crowdin_project_progress.svg
          git commit -m "doc: Update Crowdin project progress"
          if git push origin HEAD:main; then
            echo "Progress badge updated on main"
            exit 0
          fi
          echo "Direct push to main blocked by branch protection; opening a PR instead"
          git checkout -B crowdin-progress-badge
          git push -f origin crowdin-progress-badge
          gh pr create --base main --head crowdin-progress-badge \
            --title "doc: Update Crowdin project progress" \
            --body "Automated update of the Crowdin translation progress badge." \
            || echo "Pull request already exists; branch updated"
