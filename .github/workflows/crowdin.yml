name: Crowdin Synchronize

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  push:
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - 'app/src/main/res/values*/languages.xml'
      - 'core/resources/src/main/res/values*/strings*.xml'
      - 'eggs/AndroidNext/src/main/res/values*/strings*.xml'
      - 'eggs/RocketLauncher/src/main/res/values*/strings*.xml'
      - 'crowdin.yml'
    branches: [ main ]
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

jobs:
  crowdin:
    runs-on: ubuntu-latest
    outputs:
      has_open_pr: ${{ steps.pr.outputs.has_open_pr }}

    steps:
      - name: Check secrets
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        if: ${{ env.CROWDIN_PROJECT_ID == '' || env.CROWDIN_PERSONAL_TOKEN == '' }}
        run: exit 0

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so Enrich PR body can diff against origin/main

      - name: Crowdin synchronize
        uses: crowdin/github-action@v3 # https://github.com/marketplace/actions/crowdin-action
        with:
          upload_sources: true
          upload_translations: true
          download_translations: true

          create_pull_request: true
          localization_branch_name: l10n_crowdin_translations
          pull_request_title: 'feat: New Crowdin translations'
          pull_request_body: 'New Crowdin pull request with translations 🚀'
          commit_message: "feat: New translations from Crowdin"
          pull_request_base_branch_name: 'main'
          pull_request_labels: 'translations, enhancement'
          pull_request_assignees: 'crowdin-bot'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Enrich PR body
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --head l10n_crowdin_translations --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open Crowdin PR to update"
            echo "has_open_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_open_pr=true" >> "$GITHUB_OUTPUT"
          LANGS=$(git diff --name-only origin/main...HEAD -- '**/values-*/strings*.xml' '**/values-*/languages.xml' \
            | sed -E 's|.*/values-([^/]+)/.*|\1|' | sort -u | paste -sd ',' -)
          STATS=$(git diff --shortstat origin/main...HEAD -- ':!script/crowdin/crowdin_project_progress.svg')
          gh pr edit "$PR" --body "$(cat <<EOF
          New Crowdin pull request with translations 🚀

          **Languages:** ${LANGS//,/, }
          **Changes:** ${STATS:-(no file changes)}
          EOF
          )"

  progress:
    needs: crowdin
    if: needs.crowdin.outputs.has_open_pr == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        if: ${{ env.CROWDIN_PROJECT_ID == '' || env.CROWDIN_PERSONAL_TOKEN == '' }}
        run: exit 0

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip' # caching pip dependencies

      - name: Update Crowdin progress
        run: |
          if ! git fetch origin l10n_crowdin_translations; then
            echo "No translations branch, skip progress update"
            exit 0
          fi
          git checkout l10n_crowdin_translations
          cd script/crowdin
          pip install -r requirements.txt
          python start.py ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          cd "$GITHUB_WORKSPACE" # start.py writes the SVG relative to its cwd, but the git commands below need repo-root-relative paths
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet script/crowdin/crowdin_project_progress.svg; then
            echo "No changes to progress SVG"
            exit 0
          fi
          git add script/crowdin/crowdin_project_progress.svg
          git commit -m "doc: Update Crowdin project progress"
          git push origin l10n_crowdin_translations
