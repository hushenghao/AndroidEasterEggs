site_name: Android Easter Eggs
site_description: All Android Easter eggs in one app.
site_url: https://hushenghao.github.io/AndroidEasterEggs/
repo_name: hushenghao/AndroidEasterEggs
repo_url: https://github.com/hushenghao/AndroidEasterEggs

# Language switcher in the header; language pages are reachable from there
# only. Adding a language: an entry here (name/lang/link), a not_in_nav
# pattern below, the LANGUAGES registry in build_pages.py, and the
# translated pages in the wiki.
extra:
  alternate:
    - name: English
      link: /AndroidEasterEggs/
      lang: en
    - name: 中文
      link: /AndroidEasterEggs/zh/
      lang: zh

# Language pages are not part of the (English) navigation index.
# Add "<lang>/*" here for each new language.
not_in_nav: |
  zh/*

docs_dir: pages-docs
site_dir: site

extra_css:
  - assets/site.css

extra_javascript:
  - assets/site.js

theme:
  name: material
  # App icon served straight from the repository, no generated asset needed
  logo: https://raw.githubusercontent.com/hushenghao/AndroidEasterEggs/main/assets/image/ic_launcher_round.png
  favicon: https://raw.githubusercontent.com/hushenghao/AndroidEasterEggs/main/assets/image/ic_launcher_round.png
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

nav:
  - Home: index.md
  - Android Versions: android-versions.md
  - Project Timeline: project-timeline.md
  - Sponsor: sponsor.md
  - Downloads:
      - F-Droid: "https://f-droid.org/packages/com.dede.android_eggs"
      - IzzyOnDroid: "https://apt.izzysoft.de/fdroid/index/apk/com.dede.android_eggs"
      - GitHub: "https://github.com/hushenghao/AndroidEasterEggs/releases"
      - Play Store: "https://play.google.com/store/apps/details?id=com.dede.android_eggs&utm_source=Github&pcampaignid=pcampaignidMKT-Other-global-all-co-prtnr-py-PartBadge-Mar2515-1"
      - Aptoide: "https://aptoide-mmp.aptoide.com/api/v1/download?package_name=com.dede.android_eggs&oemid=0d5b567e4c00ce0d0f0b816d0d88c339&redirect_url=https%3A%2F%2Fws.catappult.io%2Fapi%2FdirectToConsumer%2Fcom.dede.android_eggs%2Fdownload"
      - Pgyer (beta): "https://www.pgyer.com/eggs"
  - Known issues:
      - The application failed to uninstall: the-application-failed-to-uninstall.md
  - Developers:
      - Contributing: "https://github.com/hushenghao/AndroidEasterEggs/blob/main/.github/CONTRIBUTING.md"
      - Translation: "https://crowdin.com/project/easter-eggs"
  - License: "https://github.com/hushenghao/AndroidEasterEggs/blob/main/LICENSE"
  - Privacy Policy: privacy-policy.md

markdown_extensions:
  - toc:
      permalink: true
  # GitHub-style ~~strikethrough~~ used by wiki pages
  - pymdownx.tilde
  # Mermaid diagrams; Material loads mermaid.js lazily for fences named mermaid
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
